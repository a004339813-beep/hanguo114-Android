name: Android APK

# 推送到 apps/android 或手动点「Run workflow」时自动打包，APK 在本次运行的 Artifacts 里下载
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 可选：在仓库 Settings → Secrets 配置以下 4 个值后，产出正式签名包；
      # 未配置时自动使用 debug 签名（可直接安装测试，但不能上架应用商店）
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: hanguo114-apk
          path: apps/android/app/build/outputs/apk/hanguo114/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: korean114-apk
          path: apps/android/app/build/outputs/apk/korean114/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: google-play-aab
          path: apps/android/app/build/outputs/bundle/*Release/*.aab
